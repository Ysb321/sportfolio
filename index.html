    <script>
      // Prevent FOUC for theme — dark only, beautiful auto shading
      (function(){
        try {
          var t = localStorage.getItem('theme');
          if(t === 'light') t='ink';
          var valid = {ink:1, ocean:1, ember:1, forest:1};
          if(t && valid[t]) document.documentElement.setAttribute('data-theme', t);
          else document.documentElement.setAttribute('data-theme', 'ink');
          var a = localStorage.getItem('themeAuto');
          document.documentElement.setAttribute('data-auto', a === '0' ? '0' : '1');
        } catch(e){}
      })();
    </script>
